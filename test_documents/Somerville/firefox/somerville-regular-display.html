<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Somerville Regular Math</title>
  <style>
    @font-face {
      font-family: "Somerville";
      src:
        url("file:///Users/juliusross/Documents/fontoutputs/Somerville-Regular.otf") format("opentype");
      font-weight: 400;
      font-style: normal;
      font-display: block;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: start center;
      padding-top: 180px;
      background: #f7f5f0;
      color: #1c1c1c;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    math {
      font-family: var(--selected-somerville-font, "Somerville"), serif;
      font-optical-sizing: none;
    }

    body.default-math math {
      font-family: math;
    }

    math {
      font-size: var(--math-size, 96px);
      line-height: 1.2;
    }

    .samples {
      display: grid;
      gap: 24px;
      justify-items: center;
    }

    .control-shell {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 10;
      display: grid;
      gap: 4px;
      max-width: calc(100vw - 20px);
    }

    .controls {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
      padding: 6px;
      border: 1px solid #c9c1b3;
      border-radius: 6px;
      background: rgba(255, 253, 250, 0.94);
      box-shadow: 0 6px 18px rgba(40, 32, 20, 0.1);
    }

    .controls[hidden] {
      display: none;
    }

    button,
    select,
    input {
      padding: 4px 7px;
      border: 1px solid #c9c1b3;
      border-radius: 5px;
      background: #fffdfa;
      color: #1c1c1c;
      font: 0.82rem/1.1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      cursor: pointer;
    }

    select {
      min-width: 94px;
    }

    input[type="range"] {
      width: 86px;
      padding: 0;
    }

    label {
      display: flex;
      gap: 4px;
      align-items: center;
      padding: 3px 5px;
      border: 1px solid #c9c1b3;
      border-radius: 5px;
      background: #fffdfa;
      font-size: 0.78rem;
    }

    .font-name {
      flex-basis: 100%;
      font-size: 0.68rem;
      color: #5a554d;
    }

    .shortcut-help {
      flex-basis: 100%;
      font-size: 0.66rem;
      color: #5a554d;
    }
  </style>
  <style id="selected-font-face"></style>
</head>
<body>
  <div class="control-shell">
    <button id="controls-toggle" type="button">Hide</button>
    <div id="control-panel" class="controls">
      <button id="font-toggle" type="button">Somerville</button>
      <label>
        Optical
        <select id="opsz-select"></select>
      </label>
      <label>
        Weight
        <select id="wght-select"></select>
      </label>
      <label>
        Width
        <select id="wdth-select"></select>
      </label>
      <label>
        Font Size
        <input id="size-input" type="range" min="24" max="220" step="4" value="96">
        <output id="size-value">96px</output>
      </label>
      <div id="font-name" class="font-name"></div>
      <div class="shortcut-help">q/w: weight · a/s: width · z/x: optical size · 1/2: font size · h: show/hide UI</div>
    </div>
  </div>


  <math display="block" class="tml-display" style="display:block math;">
    <mover accent="true">
      <mspace width="4cm" height="0" depth="0"></mspace>
      <mo stretchy="true">&#x2192;</mo>
    </mover>
  </math>


  <script>
    const fontDirectory = "file:///Users/juliusross/Documents/fontoutputs/";
    const opticalSizes = [
      "Micro",
      "Miniature",
      "Minuscule",
      "Caption",
      "Regular",
      "SubHeading",
      "Display",
      "Headline",
      "Trumpet",
      "Titling",
      "Needlepoint",
      "Hairline",
    ];
    const weights = [
      { label: "SemiLight", suffix: "SemiLight" },
      { label: "Regular", suffix: "" },
      { label: "Medium", suffix: "Medium" },
      { label: "SemiBold", suffix: "SemiBold" },
      { label: "Bold", suffix: "Bold" },
      { label: "ExtraBold", suffix: "ExtraBold" },
      { label: "Black", suffix: "Black" },
    ];
    const widths = [
      { label: "SemiCondensed", suffix: "SemiCondensed" },
      { label: "Normal", suffix: "" },
      { label: "SemiExpanded", suffix: "SemiExpanded" },
    ];

    const toggle = document.getElementById("font-toggle");
    const controlsToggle = document.getElementById("controls-toggle");
    const controlPanel = document.getElementById("control-panel");
    const fontFace = document.getElementById("selected-font-face");
    const fontName = document.getElementById("font-name");
    const opszSelect = document.getElementById("opsz-select");
    const wghtSelect = document.getElementById("wght-select");
    const wdthSelect = document.getElementById("wdth-select");
    const sizeInput = document.getElementById("size-input");
    const sizeValue = document.getElementById("size-value");

    function fillSelect(select, options, defaultValue) {
      options.forEach((option) => {
        const element = document.createElement("option");
        const value = typeof option === "string" ? option : option.suffix;
        const label = typeof option === "string" ? option : option.label;
        element.value = value;
        element.textContent = label;
        select.appendChild(element);
      });

      select.value = defaultValue;
    }

    function selectedSomervilleFile() {
      return `Somerville-${opszSelect.value}${wdthSelect.value}${wghtSelect.value}.otf`;
    }

    function updateSomervilleFont() {
      const fileName = selectedSomervilleFile();
      const familyName = `Somerville-${fileName.replace(/[^a-z0-9]/gi, "-")}`;
      const url = `${fontDirectory}${encodeURIComponent(fileName)}`;

      fontFace.textContent = `
        @font-face {
          font-family: "${familyName}";
          src: url("${url}") format("opentype");
          font-weight: 400;
          font-style: normal;
          font-display: block;
        }
      `;
      document.documentElement.style.setProperty("--selected-somerville-font", `"${familyName}"`);
      fontName.textContent = fileName;
    }

    function updateMathSize() {
      document.documentElement.style.setProperty("--math-size", `${sizeInput.value}px`);
      sizeValue.textContent = `${sizeInput.value}px`;
    }

    function stepSelect(select, direction) {
      const index = select.selectedIndex;
      const nextIndex = Math.min(Math.max(index + direction, 0), select.options.length - 1);

      if (nextIndex === index) {
        return;
      }

      select.selectedIndex = nextIndex;
      updateSomervilleFont();
    }

    function stepMathSize(direction) {
      const step = Number(sizeInput.step) || 1;
      const min = Number(sizeInput.min);
      const max = Number(sizeInput.max);
      const nextValue = Math.min(Math.max(Number(sizeInput.value) + direction * step, min), max);

      sizeInput.value = String(nextValue);
      updateMathSize();
    }

    function toggleControlPanel() {
      controlPanel.hidden = !controlPanel.hidden;
      controlsToggle.textContent = controlPanel.hidden ? "Show" : "Hide";
    }

    fillSelect(opszSelect, opticalSizes, "Regular");
    fillSelect(wghtSelect, weights, "");
    fillSelect(wdthSelect, widths, "");
    [opszSelect, wghtSelect, wdthSelect].forEach((select) => {
      select.addEventListener("change", updateSomervilleFont);
    });
    sizeInput.addEventListener("input", updateMathSize);
    updateSomervilleFont();
    updateMathSize();

    toggle.addEventListener("click", () => {
      document.body.classList.toggle("default-math");
      toggle.textContent = document.body.classList.contains("default-math")
        ? "Default Math"
        : "Somerville";
    });

    controlsToggle.addEventListener("click", toggleControlPanel);

    document.addEventListener("keydown", (event) => {
      if (event.metaKey || event.ctrlKey || event.altKey) {
        return;
      }

      const key = event.key.toLowerCase();

      if (key === "h") {
        event.preventDefault();
        toggleControlPanel();
      } else if (key === "q") {
        event.preventDefault();
        stepSelect(wghtSelect, -1);
      } else if (key === "w") {
        event.preventDefault();
        stepSelect(wghtSelect, 1);
      } else if (key === "a") {
        event.preventDefault();
        stepSelect(wdthSelect, -1);
      } else if (key === "s") {
        event.preventDefault();
        stepSelect(wdthSelect, 1);
      } else if (key === "z") {
        event.preventDefault();
        stepSelect(opszSelect, -1);
      } else if (key === "x") {
        event.preventDefault();
        stepSelect(opszSelect, 1);
      } else if (key === "1") {
        event.preventDefault();
        stepMathSize(-1);
      } else if (key === "2") {
        event.preventDefault();
        stepMathSize(1);
      }
    });
  </script>
</body>
</html>
